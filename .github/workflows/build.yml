# Build Kuiper Imager 2 from source and smoke-test the result.
#
# Shape note: this is written as a one-entry matrix on purpose. Everything
# OS-specific lives either in the `ci-<os>` CMake preset or in a single guarded
# dependency step, so adding macOS/Windows is one matrix row + one preset — not
# a second hand-written job. See CMakePresets.json.
name: build

on:
  push:
    branches: [main, v2.0]
  pull_request:
    branches: [main, v2.0]
  workflow_dispatch:

# A new push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with QT_VERSION in docker/Dockerfile so the dev container and
  # CI resolve the same Qt through aqtinstall.
  QT_VERSION: 6.8.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: ci-linux
          # Enable once the Windows/macOS drive backends land (plan.md §6):
          # - { name: windows, os: windows-2022, preset: ci-windows }
          # - { name: macos,   os: macos-15,     preset: ci-macos   }

    steps:
      - uses: actions/checkout@v7

      # 24.04 (not 22.04): src/core/include/kuiper/Error.hpp uses std::expected,
      # which needs GCC >= 12. The 22.04 runner's default GCC 11 cannot build it.
      # libssl-dev: core links OpenSSL::Crypto for hardware SHA-256 (find_package
      # OpenSSL REQUIRED). The runner preinstalls the runtime but not the headers.
      # Keep in sync with docker/Dockerfile's apt list.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libarchive-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libfontconfig1 \
            libdbus-1-3 \
            libglib2.0-0t64

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          # Core is enough for libkuiper + kli; Widgets pulls in Gui for the GUI
          # target. Both ship in the base package, so no `modules` needed.

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Proves the binary links and starts. `list-drives` is deliberately not
      # used as a gate — its output depends on the runner's block devices.
      - name: Smoke test (kli version)
        run: ./build-ci/src/cli/kli version

      # TODO: add `ctest --preset ${{ matrix.preset }}` once tests exist.

      # NOT distributable: these link against the aqtinstall Qt and will not run
      # on a machine without it. Real bundles (AppImage / .dmg / NSIS, plan.md §9)
      # come with the packaging work.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-${{ matrix.name }}-unpackaged
          path: |
            build-ci/src/cli/kli
            build-ci/src/gui/kuiper-imager
          if-no-files-found: error
          retention-days: 14

  # Native Debian package (.deb) for the CLI. Separate from `build` on purpose:
  # the .deb must link the DISTRO's Qt (declared as a dependency and resolved at
  # install time), NOT aqtinstall's Qt 6.8 — Qt's ABI compatibility is one-way, so
  # a 6.8-built binary may fail to load on a distro's 6.4. Built inside a debian:12
  # container (GCC 12 for std::expected; Qt 6.4.2; glibc 2.36) so the package runs
  # on Debian 12, Ubuntu 24.04, and everything newer. See plan.md §9.
  package-deb:
    name: package (deb)
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - uses: actions/checkout@v7

      # Build against the distro Qt (qt6-base-dev = Qt 6.4.2) instead of aqt.
      # dpkg-dev provides dpkg-shlibdeps (CPACK_DEBIAN_PACKAGE_SHLIBDEPS); lintian
      # checks the resulting package. Keep the C-lib list in sync with the Linux
      # build job above and docker/Dockerfile.
      - name: Install build + packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            ca-certificates \
            qt6-base-dev \
            libarchive-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            dpkg-dev \
            lintian

      - name: Configure
        run: cmake --preset deb-linux

      - name: Build
        run: cmake --build --preset deb-linux

      - name: Smoke test (kli version)
        run: ./build-deb/src/cli/kli version

      - name: Package (cpack -G DEB)
        working-directory: build-deb
        run: cpack -G DEB

      # Informational for now (|| true): triage warnings on the first green run,
      # then drop the `|| true` to make lintian a hard gate.
      - name: Lint package (lintian)
        run: lintian build-deb/*.deb || true

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: kuiper-imager-cli-deb
          path: build-deb/*.deb
          if-no-files-found: error
          retention-days: 14
